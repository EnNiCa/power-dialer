<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Dialer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <main class="login-shell">
        <section class="login-brand">
            <div class="brand-mark">Dialer</div>
            <p class="brand-tagline">Tu cola de llamadas te espera.</p>
            <div class="keypad" aria-hidden="true">
                <span>1</span><span>2</span><span>3</span>
                <span>4</span><span class="key-active">5</span><span>6</span>
                <span>7</span><span>8</span><span>9</span>
                <span>&#42;</span><span>0</span><span>#</span>
            </div>
        </section>
        <section class="login-panel">
            <div class="login-card">
                <h1>Entrar</h1>
                <p class="subtitle">Accede con tu usuario y contraseña.</p>

                {% if error %}
                    <p class="form-error">{{ error }}</p>
                {% endif %}

                <form method="POST">
                    <div class="field">
                        <label for="username">Usuario</label>
                        <input type="text" name="username" id="username" autocomplete="username" required autofocus>
                    </div>
                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input type="password" name="password" id="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit">Entrar</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
